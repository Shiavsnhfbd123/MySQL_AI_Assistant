services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.1}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.1}
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:3b"]

  app:
    depends_on:
      mysql:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      AI_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b

volumes:
  ollama-data:
